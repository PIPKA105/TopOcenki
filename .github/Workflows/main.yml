name: Build Romashka VPN
on: 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  iphone-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Toolchain
        run: |
          pip install kivy-ios
          brew install autoconf automake libtool pkg-config
          # Инструменты для сборки IPA

      - name: Build IPA
        run: |
          toolchain build python3 kivy
          toolchain create RomashkaVPN .
          # Собираем проект Studio 26

      - name: Upload Result
        uses: actions/upload-artifact@v3
        with:
          name: Romashka_Installer
          path: .
