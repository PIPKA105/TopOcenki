name: Build Romashka VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # Гитхаб выделит нам виртуальный макбук бесплатно!

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Kivy-ios and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kivy-ios
          brew install autoconf automake libtool pkg-config
          # Настраиваем среду для сборки под iOS

      - name: Build Project
        run: |
          toolchain build python3 kivy
          toolchain create RomashkaVPN .
          # Здесь магия превращения кода в проект Xcode

      - name: Export IPA (Archive)
        run: |
          # Мы создаем архив проекта, который Feather сможет съесть
          mkdir -p output
          zip -r output/RomashkaVPN.ipa RomashkaVPN-ios
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: RomashkaVPN-Package
          path: output/RomashkaVPN.ipa
