name: Romashka IPA Builder
on: [workflow_dispatch, push]

jobs:
  build-ipa:
    runs-on: macos-latest # Обязательно мак для IPA
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Toolchain
        run: |
          pip install kivy-ios
          brew install autoconf automake libtool pkg-config

      - name: Create Structure
        run: |
          toolchain create RomashkaVPN .
          # Это создаст папку проекта Xcode
          
          mkdir -p Payload/RomashkaVPN.app
          # Имитируем структуру для Feather
          cp main.py Payload/RomashkaVPN.app/
          cp romashka.png Payload/RomashkaVPN.app/

      - name: Pack IPA
        run: |
          zip -r RomashkaVPN.ipa Payload/
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Romashka_VPN_IPA
          path: RomashkaVPN.ipa
